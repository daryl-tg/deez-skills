# The index. Every skill, command, and subagent this hub owns is listed here,
# and nothing is linked into a runtime unless it appears below.
#
# Adding an entry by hand is fine, but `bin/new` and `bin/adopt` do it for you
# and regenerate the README. `bin/doctor` fails if this file and the folders on
# disk disagree.

[meta]
version = 1
default_profile = "full"

# Categories are the unit profiles select on, so keep them coarse.
[categories]
core     = "Always-on essentials"
om-chat  = "OM Chat feature delivery"
kiyotaka = "Kiyotaka / orange stack"
workflow = "General workflow"
writing  = "Writing and editing"
infra    = "Infrastructure and observability"

# A profile is what one machine installs. "*" means every category.
# Skill metadata costs ~5k tokens of context per session at ~70 skills, so a
# machine that does not need a stack should not carry it.
[profiles]
full = ["*"]
lean = ["core", "workflow", "writing"]

# Where each kind of work runs. Claude hosts the router because
# disable-model-invocation is a no-op on Codex, and because Claude can dispatch
# to Codex while the reverse has no clean path.
#
# The four below default_lane are not preferences. Design, review, verification,
# and git mutations stay with Claude whatever default_lane says, and the
# registry rejects any other value for them.
#
# Switching who implements is this one line.
[routing]
default_lane  = "codex"
planning      = "claude"
review        = "claude"
verification  = "claude"
git_mutations = "claude"

# ---------------------------------------------------------------------------
# Every entry declares a `layer`, which decides how it may be invoked:
#
#   mode           the router. Sticky, explicitly routed to, Claude only.
#   principle      one rule. Cited by playbooks. Must be on BOTH runtimes so a
#                  handoff citation resolves on either side.
#   playbook-host  owns a playbooks/ directory. Claude only.
#   workflow       everything else. May stay model-invocable. The default.
#
# mode, principle, and playbook-host must ship disable-model-invocation: true.
# bin/doctor fails the build when a layer and its frontmatter disagree.
# ---------------------------------------------------------------------------

[skills]

# --- Verification substrate -------------------------------------------------
# The memory and context every other layer reads. Explicitly invoked, so both
# carry the flag even though `workflow` does not require it.

[skills.create-verification-skill]
layer    = "workflow"
category = "core"
runtimes = ["claude", "codex"]

[skills.maintain-verification-skill]
layer    = "workflow"
category = "core"
runtimes = ["claude", "codex"]

